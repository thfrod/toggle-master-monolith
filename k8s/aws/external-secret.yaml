apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: togglemaster-runtime
  namespace: togglemaster
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: togglemaster-runtime
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: togglemaster/fase2/runtime
