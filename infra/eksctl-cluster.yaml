apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: togglemaster-fase2
  region: us-east-1

vpc:
  nat:
    gateway: Single

managedNodeGroups:
  - name: togglemaster-workers
    instanceType: t3.small
    minSize: 1
    desiredCapacity: 2
    maxSize: 4
    privateNetworking: true
    volumeSize: 30
    volumeType: gp3
    iam:
      withAddonPolicies:
        autoScaler: true
        ebs: true
        cloudWatch: true
